name: ECO PARTY APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract ECO PARTY project
        run: |
          unzip -q ECO_PARTY_FIREBASE_V1.4_OWNER_CONNECTED.zip
          test -f ecobuild/settings.gradle

      - name: Build APK
        run: |
          gradle -p ecobuild assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ECO-PARTY-APK
          path: ecobuild/app/build/outputs/apk/debug/app-debug.apk
